name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install the aarch64 linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="translatex-${{ matrix.target }}"
          mkdir -p dist
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/translatex.exe" dist/
          else
            cp "target/${{ matrix.target }}/release/translatex" dist/
          fi
          tar -czf "${name}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v7
        with:
          name: translatex-${{ matrix.target }}
          path: translatex-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore provenance for the npm tarballs.
      id-token: write
    env:
      # Step-level `if` cannot read `secrets`, so hoist it to job env and test that.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Configure npm auth
        if: env.NPM_TOKEN != ''
        run: npm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}" --location=user

      - name: Sync every package version with the tag
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const version = process.env.REF_NAME.replace(/^v/, "");
            const files = [
              "npm/package.json",
              ...fs.readdirSync("npm/platforms").map((d) => `npm/platforms/${d}/package.json`),
            ];
            for (const file of files) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              for (const dep of Object.keys(pkg.optionalDependencies ?? {})) {
                pkg.optionalDependencies[dep] = version;
              }
              fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
            }
          '
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Stage the binaries into the platform packages
        shell: bash
        run: |
          set -euo pipefail
          declare -A targets=(
            [win32-x64]=x86_64-pc-windows-msvc
            [linux-x64]=x86_64-unknown-linux-gnu
            [linux-arm64]=aarch64-unknown-linux-gnu
            [darwin-x64]=x86_64-apple-darwin
            [darwin-arm64]=aarch64-apple-darwin
          )
          for key in "${!targets[@]}"; do
            tar -xzf "artifacts/translatex-${targets[$key]}.tar.gz" -C "npm/platforms/${key}"
          done
          ls -l npm/platforms/*/translatex*

      # Platform packages first: the main package pins their exact version, so a
      # half-finished release would leave `npm install -g translatex` broken.
      - name: Publish the platform packages
        if: env.NPM_TOKEN != ''
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in npm/platforms/*/; do
            echo "publishing ${dir}"
            (cd "$dir" && npm publish --access public --provenance)
          done

      - name: Publish the main package
        if: env.NPM_TOKEN != ''
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --access public --provenance
