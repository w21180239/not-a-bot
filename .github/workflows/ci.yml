name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is not here on purpose: the hosted arm64 pool currently fails to
        # hand out runners, and the job is killed after 15 minutes with zero
        # steps. macOS compilation and linking still run in release.yml.
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --all-targets --locked

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --all-targets --locked

  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: node --check npm/bin/not-a-bot.js

      - name: Check the platform manifests are wired together
        working-directory: npm
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const main = require("./package.json");
            const names = [];
            for (const dir of fs.readdirSync("platforms")) {
              const pkg = JSON.parse(fs.readFileSync(path.join("platforms", dir, "package.json"), "utf8"));
              names.push(pkg.name);
              const pinned = main.optionalDependencies[pkg.name];
              if (!pinned) throw new Error(`${pkg.name} is missing from optionalDependencies`);
              if (pinned !== pkg.version) {
                throw new Error(`${pkg.name} is pinned to ${pinned}, its manifest says ${pkg.version}`);
              }
            }
            for (const dep of Object.keys(main.optionalDependencies)) {
              if (!names.includes(dep)) throw new Error(`${dep} has no platform directory`);
            }
            console.log(`ok: ${names.length} platform packages match the shim manifest`);
          '

      - name: Pack the shim
        working-directory: npm
        run: npm pack --dry-run
