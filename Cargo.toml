[package]
name = "translatex"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Agent-first translation CLI and MCP server. Official APIs, structured JSON output, provider fallback and key rotation built in."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourorg/translatex"
homepage = "https://github.com/yourorg/translatex"
documentation = "https://github.com/yourorg/translatex#readme"
keywords = ["translation", "cli", "mcp", "agent", "i18n"]
categories = ["command-line-utilities", "web-programming", "text-processing"]
readme = "README.md"

[lib]
name = "translatex"
path = "src/lib.rs"

[[bin]]
name = "translatex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
config = { version = "0.14", default-features = false, features = ["toml"] }
dashmap = "6"
directories = "5"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
keyring = "3"
once_cell = "1"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream", "cookies"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "fs", "process"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
